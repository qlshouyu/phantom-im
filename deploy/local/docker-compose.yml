# Phantom IM 本地联调栈（M0）：MySQL + Redis
# RocketMQ 在 docs/third/rocketmq/docker-compose.yml 单独启动（已就绪）
# 用法：docker compose -f deploy/local/docker-compose.yml up -d
services:
  mysql:
    image: mysql:8.0
    container_name: phantom-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: phantom_im
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - phantom-mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4
    container_name: phantom-redis
    ports:
      - "6379:6379"
    volumes:
      - phantom-redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  phantom-mysql-data:
  phantom-redis-data:
