// Phantom IM 通讯协议 - 连接管理与信令（认证/心跳/踢下线/输入状态/在线状态/App 状态）
// 设计文档: docs/design/2026-08-07-im-protocol-design.md 第 2、5 节
syntax = "proto3";

package phantom.v1;

import "phantom/v1/common.proto";

option java_package = "im.phantom.proto.v1";
option java_multiple_files = true;
option go_package = "phantom.im/proto/phantom/v1;phantomv1";

// ---- 认证握手（连接建立后首帧，10 秒未认证服务端断开）----

message AuthReq {
  string access_token = 1;    // UserToken：接入方服务端用 AppSecret 签发的 JWT（设计文档 6.2）
  string device_id = 2;       // 客户端生成并持久化的设备唯一标识
  DeviceType device_type = 3; // 同类型互踢依据（MD-02）
  string platform = 4;        // ios / android / windows / macos / web
  string client_version = 5;
  string app_id = 6;          // 应用标识（AC-01），验签与租户路由依据
  string user_id = 7;         // Phantom ID，须与 UserToken claims 一致
}

message AuthResp {
  int64 server_time = 1;         // 毫秒，供客户端校准时钟偏移
  int64 max_user_seq = 2;        // 客户端据此判断需要 Sync 多少增量
  uint32 heartbeat_interval_s = 3; // 服务端建议心跳间隔（移动端基线 270s）
  BurnAfterReadConfig burn_after_read = 4; // 应用级阅后即焚配置（设计文档 9.1）
  ReadReceiptConfig read_receipt = 5;      // 应用级已读反馈配置（设计文档 4.5）
  AppFeatureConfig app_features = 6;       // 关系链、资料写入和设备策略（AC-08）
}

// 应用级功能与设备策略。认证时下发，客户端以最近一次握手值为准。
message AppFeatureConfig {
  bool relation_hosted = 1;          // false 时平台不校验好友关系
  bool sdk_profile_write_enabled = 2; // 是否允许 SDK 写入资料
  uint32 max_devices = 3;            // 单账号在线设备上限
}

// 已读反馈配置：应用级开关（控制台配置 AC-08）。关闭时服务端不生成对端已读回执
// （ReadReceiptEvent/ReadReceiptPush）；本人多端未读同步 ReadPositionEvent 不受影响
message ReadReceiptConfig {
  bool enabled = 1;
}

// 阅后即焚配置：应用级开关（控制台配置 AC-08），每次认证握手下发，
// 客户端以最近一次握手收到的值为准（中途变更重连后生效）
message BurnAfterReadConfig {
  bool enabled = 1;
  uint32 ttl_seconds = 2;  // 本端实际展示消息后，至本地销毁的时长；enabled=false 时无意义
}

// ---- 心跳（连续 2 个周期无上行判定离线，摘除在线路由）----

message Ping {}

message Pong {
  int64 server_time = 1;
}

// ---- 踢下线（SDK 收到后不得自动重连，回调宿主 App 并透传 reason）----

message KickPush {
  KickReason reason = 1;
  string detail = 2;  // 附加信息，如封禁原因/解封时间

  enum KickReason {
    KICK_REASON_UNSPECIFIED = 0;
    KICK_REASON_SAME_TYPE_LOGIN = 1;   // 同类型设备登录顶替（MD-02）
    KICK_REASON_REMOTE_LOGOUT = 2;     // 远程下线（MD-15 / OpenAPI 强制下线 AC-10）
    KICK_REASON_TOKEN_REVOKED = 3;     // 接入方吊销凭证/禁用用户（AC-06）、AppSecret 应急轮换
    KICK_REASON_BANNED = 4;            // 平台封禁（SEC-08）
  }
}

// ---- 主动登出 ----

message LogoutReq {}

message LogoutResp {}

// ---- 输入状态（DC-06）：不落库、不进 Timeline、不 ACK，仅单聊 ----
// 发送侧 3 秒节流；接收侧 5 秒无新信令自动消失

message TypingSignal {
  string conv_id = 1;
  bool typing = 2;   // false = 显式停止输入
}

message TypingPush {
  string conv_id = 1;
  string user_id = 2;
  bool typing = 3;
}

// ---- 在线状态（DC-05）：订阅制，进入聊天页订阅、离开取消 ----

message PresenceSubReq {
  repeated string user_ids = 1;  // 单次 ≤50
}

message PresenceSubResp {
  repeated PresenceInfo presences = 1;  // 订阅时刻的当前状态
}

message PresenceUnsubReq {
  repeated string user_ids = 1;
}

message PresencePush {
  PresenceInfo presence = 1;
}

message PresenceInfo {
  string user_id = 1;
  PresenceStatus status = 2;
  int64 last_active_time = 3;  // AWAY 时有效（"最后活跃于 X 分钟前"）；OFFLINE 不透出
}

// ---- App 前后台状态（NT-10 多端推送抑制的判定输入，设计文档 5.3）----

message AppStateReq {
  bool foreground = 1;
}

message AppStateResp {}
