services:
  namesrv:
    image: apache/rocketmq:5.3.2
    container_name: rmqnamesrv
    ports:
      - "9876:9876"
    volumes:
      - ./data/namesrv/logs:/home/rocketmq/logs
    networks:
      - rocketmq
    restart: on-failure
    command: sh mqnamesrv

  broker:
    image: apache/rocketmq:5.3.2
    container_name: rmqbroker
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    volumes:
      - ./data/broker/logs:/home/rocketmq/logs
      - ./data/broker/store:/home/rocketmq/store
      - ./conf/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    depends_on:
      - namesrv
    networks:
      - rocketmq
    restart: on-failure
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf

  proxy:
    image: apache/rocketmq:5.3.2
    container_name: rmqproxy
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
    depends_on:
      - broker
      - namesrv
    networks:
      - rocketmq
    restart: on-failure
    command: sh mqproxy

  dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: rmq-dashboard
    ports:
      # 容器内 8080 → 宿主 8088（8080 已被 proxy 占用）
      - "8088:8080"
    environment:
      # 控制台在同一 docker 网络内直连 NameServer（进而发现 Broker）
      # 固定内部端口为 8080（新版镜像默认 8082），与端口映射对齐
      - JAVA_OPTS=-Dserver.port=8080 -Drocketmq.namesrv.addr=rmqnamesrv:9876 -Drocketmq.config.dataPath=/tmp/rocketmq-console/data
    depends_on:
      - namesrv
      - proxy
    networks:
      - rocketmq
    restart: on-failure

networks:
  rocketmq:
    driver: bridge
