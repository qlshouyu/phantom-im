# Broker 集群与节点标识
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0

# NameServer 地址（容器内通过服务名访问）
namesrvAddr = rmqnamesrv:9876

# 对外暴露的 Broker IP。
# 【重要】5.x proxy 架构下，是 proxy 容器负责连接 broker，因此这里必须留空/注释，
# 让 broker 自动用「容器网络 IP」注册，proxy 才能在同一 docker 网络内连到 broker。
# 若写成 127.0.0.1，proxy 会去连自己容器而非 broker，导致 rmqproxy 启动失败/反复重启。
# 客户端走 proxy(8081) 收发消息，不直接使用该地址，故无需在此填宿主机 IP。
# brokerIP1 =

# 刷盘方式：ASYNC_FLUSH(异步,性能优先) / SYNC_FLUSH(同步,可靠优先)
flushDiskType = ASYNC_FLUSH

# Broker 角色：单机部署使用 ASYNC_MASTER
brokerRole = ASYNC_MASTER

# 自动创建 Topic（生产环境建议关闭，改为手动创建）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 监听端口
listenPort = 10911

# 存储路径（对应 docker-compose 挂载的 /home/rocketmq/store）
storePathRootDir = /home/rocketmq/store
