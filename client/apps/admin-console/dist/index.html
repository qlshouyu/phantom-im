<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phantom 应用管理</title>
    <style>
      :root { font-family: system-ui, sans-serif; color-scheme: dark; }
      body { margin: 0; background: #0f172a; color: #e2e8f0; }
      header { padding: 16px 24px; background: #1e293b; border-bottom: 1px solid #334155; }
      main { max-width: 920px; margin: 24px auto; padding: 0 20px; display: grid; gap: 18px; }
      section { border: 1px solid #334155; border-radius: 12px; padding: 18px; background: #111c31; }
      h1, h2 { margin: 0 0 14px; }
      label { display: grid; gap: 6px; margin: 8px 0; font-size: 13px; color: #94a3b8; }
      input { padding: 9px; border-radius: 7px; border: 1px solid #475569; background: #0b1220; color: #e2e8f0; }
      button { padding: 9px 14px; border: 0; border-radius: 7px; background: #2563eb; color: white; cursor: pointer; }
      button.secondary { background: #475569; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #020617; padding: 12px; border-radius: 8px; }
      .row { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      #error { color: #fca5a5; }
      #secret-once { border: 1px solid #f59e0b; background: #451a03; }
    </style>
    <script type="module" crossorigin src="/assets/index-CIqQbada.js"></script>
  </head>
  <body>
    <header><h1>Phantom 应用管理</h1><span>AppID / AppSecret / 功能配置</span></header>
    <main>
      <section>
        <h2>OpenAPI 凭据</h2>
        <div class="grid">
          <label>App ID<input id="credential-app-id" value="app_demo" /></label>
          <label>App Secret<input id="credential-secret" value="phantom_demo_secret_please_change_0123456789" type="password" /></label>
        </div>
      </section>
      <section>
        <h2>创建应用</h2>
        <div class="row"><label style="flex:1">应用名称<input id="new-app-name" placeholder="我的应用" /></label><button id="create-app" data-testid="create-app">创建</button></div>
        <div id="secret-once" hidden>
          <strong>AppSecret 仅展示一次</strong>
          <pre id="created-secret" data-testid="secret-once"></pre>
        </div>
      </section>
      <section>
        <h2>应用详情与密钥轮换</h2>
        <div class="row">
          <label style="flex:1">目标 App ID<input id="target-app-id" /></label>
          <button id="load-detail" class="secondary" data-testid="load-detail">加载详情</button>
          <label>宽限天数<input id="grace-days" type="number" min="0" max="7" value="1" style="width:90px" /></label>
          <button id="rotate-secret" data-testid="rotate-secret">轮换密钥</button>
        </div>
        <pre id="app-detail" data-testid="app-detail">尚未加载</pre>
      </section>
      <section>
        <h2>应用功能配置</h2>
        <div class="grid">
          <label>关系链托管<select id="relation-hosted"><option value="true">开启</option><option value="false">关闭</option></select></label>
          <label>已读反馈<select id="read-receipt"><option value="true">开启</option><option value="false">关闭</option></select></label>
          <label>阅后即焚<select id="burn-enabled"><option value="false">关闭</option><option value="true">开启</option></select></label>
          <label>阅后即焚 TTL 秒<input id="burn-ttl" type="number" value="60" /></label>
          <label>SDK 资料写入<select id="profile-write"><option value="true">开启</option><option value="false">关闭</option></select></label>
          <label>设备上限<input id="max-devices" type="number" value="3" /></label>
        </div>
        <button id="save-config" data-testid="save-config">保存配置</button>
      </section>
      <p id="error" role="alert"></p>
    </main>
  </body>
</html>
