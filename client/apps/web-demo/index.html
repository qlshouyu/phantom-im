<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phantom IM Demo</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
      header { padding: 12px 16px; background: #1e293b; display: flex; gap: 12px; align-items: center; }
      #status { font-size: 13px; padding: 2px 8px; border-radius: 10px; background: #334155; }
      #status.online { background: #166534; }
      #status.reconnecting, #status.authing, #status.connecting { background: #92400e; }
      #status.closed { background: #7f1d1d; }
      main { max-width: 680px; margin: 0 auto; padding: 16px; }
      #messages { min-height: 340px; max-height: 60vh; overflow-y: auto; border: 1px solid #334155;
        border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
      .msg { padding: 8px 12px; border-radius: 10px; max-width: 75%; }
      .msg.self { align-self: flex-end; background: #2563eb; }
      .msg.peer { align-self: flex-start; background: #334155; }
      .msg small { display: block; opacity: 0.6; font-size: 11px; margin-top: 2px; }
      .bar { display: flex; gap: 8px; margin-top: 12px; }
      input[type=text] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #334155;
        background: #0b1220; color: #e2e8f0; }
      button { padding: 10px 14px; border-radius: 8px; border: 0; background: #2563eb; color: #fff; cursor: pointer; }
      button.secondary { background: #475569; }
      nav { display: flex; gap: 8px; padding: 10px 0; flex-wrap: wrap; }
      nav button { background: #334155; }
      nav button.active { background: #2563eb; }
      .panel { display: none; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
      .panel.active { display: block; }
      .item { padding: 8px; border-bottom: 1px solid #334155; display: flex; gap: 8px; align-items: center; }
      .item:last-child { border-bottom: 0; }
      .item button { padding: 5px 8px; font-size: 12px; }
      .msg-actions { display: flex; gap: 4px; margin-top: 5px; }
      .msg-actions button { padding: 3px 6px; font-size: 10px; background: #475569; }
    </style>
  </head>
  <body>
    <header>
      <strong>Phantom IM</strong>
      <span id="who"></span>
      <span id="status" data-testid="status">idle</span>
      <span style="flex:1"></span>
      <button id="btn-disconnect" class="secondary" data-testid="disconnect">断开</button>
      <button id="btn-reconnect" class="secondary" data-testid="reconnect">重连</button>
    </header>
    <main>
      <nav>
        <button class="active" data-panel="chat" data-testid="tab-chat">聊天</button>
        <button data-panel="conversations" data-testid="tab-conversations">会话</button>
        <button data-panel="contacts" data-testid="tab-contacts">联系人</button>
        <button data-panel="groups" data-testid="tab-groups">群聊</button>
        <button data-panel="search" data-testid="tab-search">搜索</button>
        <button data-panel="settings" data-testid="tab-settings">设备与通知</button>
      </nav>
      <section id="panel-conversations" class="panel"><h3>会话列表</h3><div id="conversation-list" data-testid="conversation-list"></div></section>
      <section id="panel-contacts" class="panel">
        <h3>联系人</h3>
        <div id="friend-list" data-testid="friend-list"></div>
        <div class="bar"><input id="friend-id" placeholder="Phantom ID" /><button id="add-friend" data-testid="add-friend">添加好友</button></div>
        <div id="request-list" data-testid="request-list"></div>
        <h3>黑名单</h3>
        <div class="bar"><input id="blacklist-id" data-testid="blacklist-id" placeholder="Phantom ID" /><button id="block-user" data-testid="block-user">拉黑</button></div>
        <div id="blacklist" data-testid="blacklist"></div>
      </section>
      <section id="panel-groups" class="panel">
        <h3>群聊</h3><div id="group-list" data-testid="group-list"></div>
        <div class="bar"><input id="group-name" placeholder="群名称" /><input id="group-members" placeholder="好友 ID，逗号分隔" /><button id="create-group" data-testid="create-group">建群</button></div>
        <p data-testid="selected-group">未选择群</p>
        <div class="bar"><input id="group-invite-id" data-testid="group-invite-id" placeholder="邀请 Phantom ID" /><button id="group-invite" data-testid="group-invite">邀请</button></div>
        <div class="bar"><input id="group-announcement-input" data-testid="group-announcement-input" placeholder="群公告" /><button id="group-announce" data-testid="group-announce">发布公告</button></div>
        <div class="bar"><input id="group-nickname-id" data-testid="group-nickname-id" placeholder="成员 Phantom ID" /><input id="group-nickname" data-testid="group-nickname" placeholder="群名片" /><button id="group-nickname-save" data-testid="group-nickname-save">保存名片</button></div>
        <div class="bar"><button id="group-mute" data-testid="group-mute">禁言 10 分钟</button><button id="group-leave" data-testid="group-leave">退群</button><button id="group-dissolve" data-testid="group-dissolve">解散</button></div>
      </section>
      <section id="panel-search" class="panel">
        <h3>全局搜索</h3><div class="bar"><input id="search-query" data-testid="search-query" placeholder="搜索联系人、群、消息" /><button id="search-btn" data-testid="search-btn">搜索</button></div><pre id="search-results" data-testid="search-results"></pre>
      </section>
      <section id="panel-settings" class="panel">
        <h3>设备</h3><div id="device-list" data-testid="device-list"></div>
        <h3>举报记录</h3><div id="report-list" data-testid="report-list"></div>
        <h3>通知</h3>
        <label><input id="push-enabled" type="checkbox" checked /> 推送总开关</label>
        <label><input id="preview-enabled" type="checkbox" checked /> 内容预览</label>
        <button id="request-notification" data-testid="request-notification">开启浏览器通知</button>
        <span id="notification-permission" data-testid="notification-permission">unknown</span>
        <button id="save-push" data-testid="save-push">保存通知设置</button>
      </section>
      <div id="messages" data-testid="messages"></div>
      <div class="bar">
        <input id="input" type="text" placeholder="输入消息…" data-testid="input" />
        <input id="file" type="file" data-testid="file" />
        <button id="btn-send" data-testid="send">发送</button>
      </div>
      <div id="report-panel" hidden>
        <select id="report-reason"><option value="SPAM">垃圾信息</option><option value="ABUSE">辱骂</option><option value="OTHER">其他</option></select>
        <button id="submit-report" data-testid="submit-report">提交举报</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
