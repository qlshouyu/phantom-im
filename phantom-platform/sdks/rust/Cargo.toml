[workspace]
resolver = "3"
members = [
    "crates/phantom-domain",
    "crates/phantom-ports",
    "crates/phantom-core",
    "crates/phantom-protocol",
    "crates/phantom-transport",
    "crates/phantom-store",
    "crates/phantom-runtime",
    "crates/phantom-sdk",
    "crates/phantom-sdk-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
phantom-domain = { path = "crates/phantom-domain" }
phantom-ports = { path = "crates/phantom-ports" }
phantom-core = { path = "crates/phantom-core" }
phantom-protocol = { path = "crates/phantom-protocol" }
phantom-transport = { path = "crates/phantom-transport" }
phantom-store = { path = "crates/phantom-store" }
phantom-runtime = { path = "crates/phantom-runtime" }
phantom-sdk = { path = "crates/phantom-sdk" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
prost = "0.14.1"
prost-build = "0.14.1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "fs", "io-util"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
directories = "6.0.0"
url = "2.5.8"
clap = { version = "4.5.50", features = ["derive"] }
sha2 = "0.10.9"
tempfile = "3.27.0"

futures-util = { version = "0.3.32", features = ["sink"] }
getrandom = "0.3.4"

schemars = "1.2.3"
base64 = "0.22.1"

hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
http-body-util = "0.1.5"
bytes = "1.12.1"
