openapi: 3.0.3
info:
  title: Phantom IM MVP API
  version: 0.2.0
  description: PaaS MVP HTTP API。长连接字段见 phantom-platform/contracts/proto/phantom/v1。
servers:
  - url: http://127.0.0.1:28080
components:
  schemas:
    ApiResponse:
      type: object
      required: [code, message, request_id]
      properties:
        code: { type: integer }
        message: { type: string }
        data: { nullable: true }
        request_id: { type: string }
    AppFeatureConfig:
      type: object
      properties:
        relation_hosted: { type: boolean }
        sdk_profile_write_enabled: { type: boolean }
        max_devices: { type: integer }
        read_receipt_enabled: { type: boolean }
        burn_after_read_enabled: { type: boolean }
        burn_after_read_ttl_seconds: { type: integer }
        risk_check_enabled: { type: boolean, default: false }
    UserProfile:
      type: object
      properties:
        user_id: { type: string }
        app_id: { type: string }
        nickname: { type: string }
        avatar_url: { type: string }
        ext: { type: object, additionalProperties: { type: string } }
        status: { type: string, enum: [ACTIVE, DISABLED, DELETED, BANNED] }
    ConversationSnapshot:
      type: object
      properties:
        conv_id: { type: string }
        conv_type: { type: string, enum: [SINGLE, GROUP] }
        target_id: { type: string }
        title: { type: string }
        avatar_url: { type: string }
        last_message_digest: { type: string }
        last_message_at: { type: integer, format: int64 }
        unread_count: { type: integer }
        mention_me: { type: boolean }
        pinned: { type: boolean }
        pinned_at: { type: integer, format: int64 }
        muted: { type: boolean }
        draft: { type: string }
        draft_edited_at: { type: integer, format: int64 }
        max_conv_seq: { type: integer, format: int64 }
        read_conv_seq: { type: integer, format: int64 }
        read_only: { type: boolean }
    ConversationPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConversationSnapshot' }
        next_cursor: { type: string, nullable: true }
        has_more: { type: boolean }
        max_user_seq: { type: integer, format: int64 }
        badge_count: { type: integer }
    Message:
      type: object
      properties:
        msg_id: { type: string }
        client_msg_id: { type: string }
        conv_id: { type: string }
        conv_seq: { type: integer, format: int64 }
        user_seq: { type: integer, format: int64 }
        server_time: { type: integer, format: int64 }
        status:
          type: string
          enum: [MSG_STATUS_SENDING, MSG_STATUS_SENT, MSG_STATUS_DELIVERED, MSG_STATUS_READ, MSG_STATUS_FAILED]
        is_request: { type: boolean }
paths:
  /openapi/apps:
    post: { summary: 创建应用, responses: { "200": { description: OK } } }
  /openapi/apps/{appId}:
    get: { summary: 应用详情, responses: { "200": { description: OK } } }
  /openapi/apps/{appId}/secrets/rotate:
    post: { summary: 轮换 AppSecret, responses: { "200": { description: OK } } }
  /openapi/apps/{appId}/config:
    get: { summary: 查询应用配置, responses: { "200": { description: OK } } }
    put: { summary: 更新应用配置, responses: { "200": { description: OK } } }
  /openapi/users:
    post: { summary: 导入 Phantom ID 用户, responses: { "200": { description: OK } } }
  /openapi/users/{userId}:
    get: { summary: 查询用户, responses: { "200": { description: OK } } }
    put: { summary: 更新用户资料, responses: { "200": { description: OK } } }
    delete: { summary: 删除并匿名化用户, responses: { "200": { description: OK } } }
  /openapi/users/{userId}/disable:
    post: { summary: 禁用用户, responses: { "200": { description: OK } } }
  /openapi/users/{userId}/restore:
    post: { summary: 恢复用户, responses: { "200": { description: OK } } }
  /openapi/users/{userId}/force-logout:
    post: { summary: 强制下线, responses: { "200": { description: OK } } }
  /users/me:
    get: { summary: 当前用户资料, responses: { "200": { description: OK } } }
    put: { summary: 更新当前用户资料, responses: { "200": { description: OK } } }
  /users/{userId}:
    get: { summary: 用户资料卡, responses: { "200": { description: OK } } }
  /friends:
    get: { summary: 好友列表, responses: { "200": { description: OK } } }
  /friends/{friendId}:
    put: { summary: 更新备注、特别关心和分组, responses: { "200": { description: OK } } }
    delete: { summary: 单向删除好友, responses: { "200": { description: OK } } }
  /friends/settings:
    get: { summary: 查询关系设置, responses: { "200": { description: OK } } }
    put: { summary: 更新关系设置, responses: { "200": { description: OK } } }
  /friends/requests:
    get: { summary: 好友申请列表, responses: { "200": { description: OK } } }
    post: { summary: 发起好友申请, responses: { "200": { description: OK } } }
  /friends/requests/{requestId}:
    post: { summary: 处理好友申请, responses: { "200": { description: OK } } }
  /friends/groups:
    get: { summary: 好友分组, responses: { "200": { description: OK } } }
    post: { summary: 创建好友分组, responses: { "200": { description: OK } } }
  /friends/groups/{groupId}:
    put: { summary: 重命名好友分组, responses: { "200": { description: OK } } }
    delete: { summary: 删除好友分组, responses: { "200": { description: OK } } }
  /blacklist:
    get: { summary: 黑名单, responses: { "200": { description: OK } } }
    post: { summary: 拉黑, responses: { "200": { description: OK } } }
    delete: { summary: 解除拉黑, responses: { "200": { description: OK } } }
  /friends/qr:
    get: { summary: 获取或创建当前用户二维码, responses: { "200": { description: OK } } }
  /friends/qr/refresh:
    post: { summary: 刷新当前用户二维码, responses: { "200": { description: OK } } }
  /friends/qr/scan:
    post: { summary: 扫描并解析二维码名片, responses: { "200": { description: OK } } }
  /groups:
    get: { summary: 群列表, responses: { "200": { description: OK } } }
    post: { summary: 创建群聊, responses: { "200": { description: OK } } }
  /groups/{groupId}:
    get: { summary: 群详情, responses: { "200": { description: OK } } }
    put: { summary: 更新群资料, responses: { "200": { description: OK } } }
    delete: { summary: 解散群聊, responses: { "200": { description: OK } } }
  /groups/{groupId}/members:
    get: { summary: 群成员列表, responses: { "200": { description: OK } } }
    post: { summary: 邀请成员, responses: { "200": { description: OK } } }
    delete:
      summary: "移出成员（query: user_id）"
      parameters:
        - { name: user_id, in: query, required: true, schema: { type: string } }
      responses: { "200": { description: OK } }
  /groups/{groupId}/invites:
    post: { summary: 生成群邀请, responses: { "200": { description: OK } } }
  /groups/{groupId}/announcement:
    get: { summary: 查询群公告, responses: { "200": { description: OK } } }
    put: { summary: 发布群公告, responses: { "200": { description: OK } } }
  /groups/{groupId}/mutes:
    post: { summary: 设置禁言, responses: { "200": { description: OK } } }
    delete: { summary: 解除禁言, responses: { "200": { description: OK } } }
  /conversations:
    get: { summary: 分页会话快照与同步基线, responses: { "200": { description: OK } } }
  /conversations/{convId}:
    get: { summary: 会话详情, responses: { "200": { description: OK } } }
    post: { summary: 更新置顶或免打扰, responses: { "200": { description: OK } } }
    delete: { summary: 删除会话视图, responses: { "200": { description: OK } } }
  /conversations/{convId}/messages:
    get: { summary: 历史消息漫游, responses: { "200": { description: OK } } }
    delete: { summary: 清空当前用户会话历史, responses: { "200": { description: OK } } }
  /conversations/{convId}/read-positions:
    get: { summary: 已读位置快照, responses: { "200": { description: OK } } }
    put: { summary: 标记已读, responses: { "200": { description: OK } } }
  /conversations/{convId}/draft:
    put: { summary: 保存草稿, responses: { "200": { description: OK } } }
    delete: { summary: 清空草稿, responses: { "200": { description: OK } } }
  /conversations/{convId}/search:
    get: { summary: 会话内搜索, responses: { "200": { description: OK } } }
  /media/upload/init:
    post:
      summary: 初始化上传
      description: >-
        media_type 为 FILE 时允许任意后缀与合法的具体 MIME；mime_type 缺失或为空白时使用
        application/octet-stream。IMAGE、VOICE、VIDEO 分别要求 image/、audio/、video/ 类型的具体 MIME。
        所有文件最大 524288000 字节，VIDEO 最大 104857600 字节，VOICE 时长 1–60 秒。
        媒体类型从初始化保留到完成；FILE 不执行图片或音视频处理。
        秒传和续传需匹配当前应用、用户、摘要、文件名、大小、MIME、媒体类型及相应的阅后即焚策略。
      responses: { "200": { description: OK } }
  /media/upload/{uploadId}/part/{partNumber}:
    put: { summary: 上传分片, responses: { "200": { description: OK } } }
  /media/upload/{uploadId}/complete:
    post: { summary: 完成上传, responses: { "200": { description: OK } } }
  /media/{mediaId}:
    get: { summary: 获取受控媒体地址, responses: { "200": { description: OK } } }
  /devices:
    get: { summary: 在线设备列表, responses: { "200": { description: OK } } }
  /devices/{deviceId}/logout:
    post: { summary: 远程下线设备, responses: { "200": { description: OK } } }
  /push/tokens:
    post: { summary: 注册推送 Token, responses: { "200": { description: OK } } }
    delete: { summary: 注销推送 Token, responses: { "200": { description: OK } } }
  /push/settings:
    get: { summary: 查询推送设置, responses: { "200": { description: OK } } }
    put: { summary: 更新推送设置, responses: { "200": { description: OK } } }
  /search:
    get: { summary: 全局搜索, responses: { "200": { description: OK } } }
  /reports:
    post: { summary: 提交举报, responses: { "200": { description: OK } } }
    get: { summary: 查询举报, responses: { "200": { description: OK } } }
  /appeals:
    post: { summary: 提交申诉, responses: { "200": { description: OK } } }
    get: { summary: 查询申诉, responses: { "200": { description: OK } } }
  /account/export:
    post: { summary: 申请数据导出, responses: { "200": { description: OK } } }
    get: { summary: 获取数据导出状态, responses: { "200": { description: OK } } }
  /account/privacy-links:
    get: { summary: 查询隐私链接, responses: { "200": { description: OK } } }
    put: { summary: 配置隐私链接, responses: { "200": { description: OK } } }
  /groups/{groupId}/members/{userId}/role:
    put: { summary: 更新群成员角色, responses: { "200": { description: OK } } }
  /groups/{groupId}/members/{userId}/nickname:
    put: { summary: 更新群成员群昵称, responses: { "200": { description: OK } } }
  /groups/{groupId}/transfer:
    post: { summary: 转让群主, responses: { "200": { description: OK } } }
  /groups/{groupId}/leave:
    delete: { summary: 退出群组, responses: { "200": { description: OK } } }
  /groups/join:
    post: { summary: 通过邀请加入群组, responses: { "200": { description: OK } } }
  /groups/{groupId}/join-requests/{requestId}:
    post: { summary: 处理入群申请, responses: { "200": { description: OK } } }
  /conversations/{convId}/request:
    post: { summary: 接受或拒绝非好友消息请求, responses: { "200": { description: OK } } }
  /messages/forward:
    post: { summary: 转发消息, responses: { "200": { description: OK } } }
  /messages/{msgId}/recall:
    post: { summary: 撤回消息, responses: { "200": { description: OK } } }
  /messages/{msgId}:
    delete: { summary: 当前用户本地删除消息, responses: { "200": { description: OK } } }
  /media/{mediaId}/content:
    get:
      summary: 读取媒体内容
      description: >-
        FILE 返回原始字节及 MIME，使用 Content-Disposition attachment 与 UTF-8 编码的原始文件名。
        图片和缩略图预览不设置附件响应头。所有成功内容响应设置 X-Content-Type-Options nosniff。
        Easy IM BFF 保留 Content-Disposition、X-Content-Type-Options 和 Cache-Control 响应头。
      responses: { "200": { description: OK } }
  /search/suggest:
    get: { summary: 搜索联想, responses: { "200": { description: OK } } }
  /search/rebuild:
    post: { summary: 重建当前用户搜索索引, responses: { "200": { description: OK } } }
  /account/minor-mode:
    post: { summary: 设置未成年人模式, responses: { "200": { description: OK } } }
